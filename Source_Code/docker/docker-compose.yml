version: '3.8'

services:
  opensearch:
    image: opensearchproject/opensearch:2.11.0
    container_name: cyberguard-opensearch
    environment:
      - cluster.name=cyberguard-cluster
      - node.name=cyberguard-node
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
    networks:
      - cyberguard-net
    volumes:
      - opensearch-data:/usr/share/opensearch/data

  cyberguard-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: cyberguard-api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_PORT=9200
      - PYTHONUNBUFFERED=1
    depends_on:
      - opensearch
    networks:
      - cyberguard-net

networks:
  cyberguard-net:
    driver: bridge

volumes:
  opensearch-data:
